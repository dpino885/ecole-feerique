<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L'École Féérique</title>
    <link rel="stylesheet" href="style.css">
   <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="canvasParticules"></canvas>

    <div class="interface" id="menuPrincipal">
        <button id="btnPleinEcran" onclick="basculerPleinEcran()" title="Plein écran">🖥️</button>
        <div class="barre-titre">
            <h1><img src="images/titre.png" alt="L'École Féérique" class="titre-image"></h1>
        </div>
        
        <div class="zone-menu-scroll">
            <div class="menu-boutons">
                <button onclick="ouvrirModule('chiffres')" class="btn-menu">
                    <img src="images/bouton-chiffres.png" alt="Chiffres" draggable="false">
                </button>

                <button onclick="ouvrirModule('alphabet')" class="btn-menu">
                    <img src="images/bouton-alphabet.png" alt="Alphabet" draggable="false">
                </button>

                <button onclick="ouvrirModule('formes')" class="btn-menu">
                    <img src="images/bouton-formes.png" alt="Formes" draggable="false">
                </button>


                <button onclick="ouvrirModule('tracerLettres')" class="btn-menu" type="button">
                    <img src="images/bouton-alphabet-tracer.png" alt="Tracer les lettres" draggable="false">
                </button>

                <button onclick="ouvrirModule('tracerChiffres')" class="btn-menu" type="button">
                    <img src="images/bouton-chiffres-tracer.png" alt="Tracer les chiffres" draggable="false">
                </button>

                <button onclick="ouvrirModule('dessin')" class="btn-menu">
                    <img src="images/bouton-dessin.png" alt="Dessin" draggable="false">
                </button>

                <button onclick="ouvrirModule('memory')" class="btn-menu btn-memory-texte">
                    <span>Memory</span>
                </button>

                <button onclick="ouvrirModule('histoire')" class="btn-menu btn-histoire-texte">
                    <span>Histoire</span>
                </button>

                <button onclick="ouvrirModule('piano')" class="btn-menu">
                    <img src="images/bouton-piano.png" alt="Le Piano aux Étoiles" draggable="false">
                </button>
            </div>
        </div>
    </div>

    <button id="btnRetourGlobal" onclick="retourMenu()" aria-label="Retour au menu"
        style="display:none; position:fixed; top:20px; left:20px; z-index:99999; width:80px; height:80px; font-size:40px; background:rgba(49, 27, 146, 0.9); border:4px solid white; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;">
        🏠
    </button>

    <div id="moduleChiffres" class="module-ecran" style="display:none;">
        <h2 id="compteurFées">Fées trouvées : 0</h2>
        <div id="areneFées"></div>
    </div>

    <div id="moduleAlphabet" class="module-ecran" style="display: none;">
        <div id="ecranDepartAlphabet">
            <button class="btn-jouer-alphabet" onclick="demarrerAlphabet()">▶️ JOUER</button>
            <p>Clique pour commencer l'alphabet !</p>
        </div>

        <div id="zoneLettreMagique" style="display: none;">
            <div class="navigation-alphabet">
                <button class="nav-btn" onclick="lettrePrecedente()">⬅️</button>
                <div class="conteneur-lettre-centrale">
                    <button id="grandeLettre" onclick="interagirLettre()"></button>
                    <div id="emojiExemple"></div>
                    <p id="motExemple"></p>
                </div>
                <button class="nav-btn" onclick="lettreSuivante()">➡️</button>
            </div>
        </div>
    </div>

    <div id="moduleFormes" class="module-ecran" style="display: none;">
        <div id="jeuFormes">
            <h2 id="consigneForme">Chargement du défi...</h2>
            <div id="zoneOptionsFormes"></div>
        </div>
    </div>

    <div id="moduleTracerLettres" class="module-ecran" style="display: none;">
        <div id="conteneurTracerLettres">
            <canvas id="canvasTracerLettres"></canvas>
        </div>
        <div class="barre-laterale">
            <button class="btn-outil-special" onclick="retourMenu()" title="Retour au menu" aria-label="Retour au menu">🏠</button>
            <hr class="separateur-lateral">
            <div class="grille-couleurs">
                <button class="pastille-laterale" style="background: #ff0000;" onclick="changerCouleur('#ff0000')"></button>
                <button class="pastille-laterale" style="background: #00ff00;" onclick="changerCouleur('#00ff00')"></button>
                <button class="pastille-laterale" style="background: #0000ff;" onclick="changerCouleur('#0000ff')"></button>
                <button class="pastille-laterale" style="background: #ff00ff;" onclick="changerCouleur('#ff00ff')"></button>
                <button class="pastille-laterale" style="background: #ff9800;" onclick="changerCouleur('#ff9800')"></button>
                <button class="pastille-laterale" style="background: #ffff00;" onclick="changerCouleur('#ffff00')"></button>
                <button class="pastille-laterale" style="background: #ffffff;" onclick="changerCouleur('#ffffff')"></button>
                <button class="pastille-laterale btn-poubelle" onclick="effacerDessin()">🗑️</button>
            </div>
        </div>
    </div>

    <div id="moduleTracerChiffres" class="module-ecran" style="display: none;">
        <div id="conteneurTracerChiffres">
            <canvas id="canvasTracerChiffres"></canvas>
        </div>
        <div class="barre-laterale">
            <button class="btn-outil-special" onclick="retourMenu()" title="Retour au menu" aria-label="Retour au menu">🏠</button>
            <hr class="separateur-lateral">
            <div class="grille-couleurs">
                <button class="pastille-laterale" style="background: #ff0000;" onclick="changerCouleur('#ff0000')"></button>
                <button class="pastille-laterale" style="background: #00ff00;" onclick="changerCouleur('#00ff00')"></button>
                <button class="pastille-laterale" style="background: #0000ff;" onclick="changerCouleur('#0000ff')"></button>
                <button class="pastille-laterale" style="background: #ff00ff;" onclick="changerCouleur('#ff00ff')"></button>
                <button class="pastille-laterale" style="background: #ff9800;" onclick="changerCouleur('#ff9800')"></button>
                <button class="pastille-laterale" style="background: #ffff00;" onclick="changerCouleur('#ffff00')"></button>
                <button class="pastille-laterale" style="background: #ffffff;" onclick="changerCouleur('#ffffff')"></button>
                <button class="pastille-laterale btn-poubelle" onclick="effacerDessin()">🗑️</button>
            </div>
        </div>
    </div>

    <div id="moduleDessin" class="module-ecran" style="display: none;">
    
    <div id="conteneurCanevas">
        <canvas id="canvasDessin"></canvas>
    </div>

    <div class="barre-laterale">
        
        <button class="btn-outil-special" onclick="retourMenu()" title="Retour au menu" aria-label="Retour au menu">🏠</button>
        
        <hr class="separateur-lateral">

        <div class="grille-couleurs">
            <button class="pastille-laterale" style="background: #ff0000;" onclick="changerCouleur('#ff0000')"></button>
            <button class="pastille-laterale" style="background: #00ff00;" onclick="changerCouleur('#00ff00')"></button>
            <button class="pastille-laterale" style="background: #0000ff;" onclick="changerCouleur('#0000ff')"></button>
            <button class="pastille-laterale" style="background: #ff00ff;" onclick="changerCouleur('#ff00ff')"></button>
            <button class="pastille-laterale" style="background: #ff9800;" onclick="changerCouleur('#ff9800')"></button>
            <button class="pastille-laterale" style="background: #ffff00;" onclick="changerCouleur('#ffff00')"></button>
            <button class="pastille-laterale" style="background: #ffffff;" onclick="changerCouleur('#ffffff')"></button>
            
            <button class="pastille-laterale btn-poubelle" onclick="effacerDessin()">🗑️</button>
        </div>

    </div>
</div>

<div id="moduleHistoire" class="module-ecran" style="display: none;">
    <div id="selectionHistoires">
        <div class="grille-livres" id="grilleLivres"></div>
    </div>

    <div id="lecteurHistoire" style="display: none;">
        <button class="btn-fermer-histoire" onclick="quitterHistoire()">✖</button>

        <div class="zone-page">
            <img id="imageHistoire" src="" alt="Page de l'histoire">
            <div id="ecranFinHistoire" class="ecran-noir-fin" style="display: none;">
                <span>FIN</span>
            </div>
        </div>

        <div class="navigation-histoire">
            <button id="btnPrecedentHistoire" class="nav-btn-histoire" onclick="pagePrecedente()">⬅️</button>
            <button id="btnSuivantHistoire" class="nav-btn-histoire" onclick="pageSuivante()">➡️</button>
        </div>
    </div>
</div>

<div id="moduleMemory" class="module-ecran" style="display: none;">
    <button class="btn-retour-memory" onclick="retourMenu()" aria-label="Retour au menu">🏠</button>
    <div id="interfaceMemory">
        <div class="selection-difficulte">
            <button onclick="changerDifficulteMemory('facile')">Facile</button>
            <button onclick="changerDifficulteMemory('normal')">Normal</button>
            <button onclick="changerDifficulteMemory('difficile')">Difficile</button>
        </div>
        <h2 id="infoMemory">Niveau : Facile</h2>
    </div>
    <div id="grilleMemory"></div>
</div>

    <div id="modulePiano" class="module-ecran" style="display: none;">
        <button class="btn-retour-piano" onclick="retourMenuPiano()" aria-label="Retour au menu">🏠</button>

        <div id="interfacePiano">
            <button id="btnListeComptines" onclick="ouvrirListeComptines()">🎵 Chansons</button>
            <h2 id="titreComptine">Mode Libre</h2>
        </div>

        <div id="conteneurClavier">
            <div id="clavierPiano">
                <!-- Les touches seront générées ici pour plus de flexibilité -->
            </div>
        </div>

        <div id="overlayComptines" style="display: none;">
            <div class="fenetre-comptines">
                <button onclick="fermerListeComptines()" class="btn-fermer-comptines">✖</button>
                <h3>Choisis une chanson</h3>
                <div id="grilleComptines"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
